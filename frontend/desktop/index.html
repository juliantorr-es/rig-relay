<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rig Relay</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/widgets.css">
</head>
<body>

  <header id="top-header">
    <span class="header-title">Rig Relay</span>
    <span id="status-session" class="header-chip"><span class="header-dot"></span>No session</span>
    <span class="header-spacer"></span>
    <span id="status-safety" class="header-chip"><span class="header-dot"></span>Unknown</span>
    <span id="status-connection" class="header-chip warn"><span class="header-dot"></span>Disconnected</span>
  </header>

  <div id="mode-bar">
    <button class="mode-option active" data-mode="operator">Operator</button>
    <button class="mode-option" data-mode="review">Review</button>
    <button class="mode-option" data-mode="system">System</button>
  </div>

  <div id="main-grid" data-mode="operator">
    <div id="chat-column">
      <div id="chat-surface">
        <div id="chat-transcript">
          <div class="chat-message system">Rig Relay ready. Type a message to begin.</div>
        </div>
        <div id="chat-composer">
          <textarea id="chat-input" placeholder="Type a message..." maxlength="4000" rows="1"></textarea>
          <button id="send-btn" disabled>Send</button>
        </div>
        <div id="composer-footer">
          <span id="char-count">0/4000</span>
          <button id="clear-chat-btn">Clear</button>
        </div>
      </div>
    </div>
    <div id="panel-column"></div>
  </div>

  <div id="expanded-overlay">
    <button id="expanded-close-btn" class="close-btn">&times;</button>
    <div id="expanded-content" class="expanded-widget"></div>
  </div>

  <footer id="footer-bar">
    <span>Rig Relay</span>
    <span class="header-spacer"></span>
    <span>Local authority. Content-light sharing. Read-only remote.</span>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
