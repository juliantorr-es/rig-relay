name: "CodeQL Swift Advisory"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

jobs:
  swift-codeql-advisory:
    name: Swift CodeQL Advisory
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"

      - name: Write advisory summary
        if: always()
        run: |
          {
            echo "## Swift CodeQL Advisory"
            echo
            echo "- Swift CodeQL parked because observed autobuild took 533 seconds in default CI."
            echo "- Not part of required release CI."
            echo "- Future hardening target: deterministic Swift build command or manual build-mode."
          } >> "$GITHUB_STEP_SUMMARY"
