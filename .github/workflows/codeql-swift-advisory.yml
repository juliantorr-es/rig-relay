name: "CodeQL Swift Advisory"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

jobs:
  swift-codeql-advisory:
    name: Swift CodeQL Advisory
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Initialize CodeQL for Swift
        uses: github/codeql-action/init@v4
        with:
          languages: swift

      - name: Autobuild Swift shell
        uses: github/codeql-action/autobuild@v4

      - name: Analyze Swift
        uses: github/codeql-action/analyze@v4

      - name: Write Swift advisory summary
        if: always()
        run: |
          {
            echo "## Swift CodeQL Advisory"
            echo
            echo "- Status: advisory/manual/scheduled only"
            echo "- Reason: Swift autobuild took 533 seconds in default CI"
            echo "- Required release CI: Python/schema/static-site/DeepSeek/GitHub-auth-safe jobs only"
            echo "- Future promotion: requires deterministic Swift build command and stable runtime evidence"
          } >> "$GITHUB_STEP_SUMMARY"
