name: Release to PyPI and Zed store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Set true to publish a distribution to PyPI"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_zed_extension:
        description: "Set true to publish the Zed extension"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  release-pypi:
    name: Release to PyPI
    runs-on: ubuntu-latest
    if: github.repository == 'juliantorr-es/rig-relay' && (github.event_name == 'release' || github.event.inputs.publish_to_pypi == 'true')
    environment:
      name: pypi
      url: https://pypi.org/p/rig-relay
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

  release-zed-extension:
    name: Release Zed Extension
    runs-on: ubuntu-latest
    if: github.repository == 'juliantorr-es/rig-relay' && (github.event_name == 'release' || github.event.inputs.publish_zed_extension == 'true')
    permissions:
      contents: read
    environment:
      name: zed
    steps:
      - uses: huacnlee/zed-extension-action@8cd592a0d24e1e41157740f1a529aeabddc88a1b # v2
        with:
          extension-name: rig-relay
          push-to: mistralai/zed-extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.ZED_EXTENSION_GITHUB_TOKEN }}
