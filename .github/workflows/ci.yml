            echo "- Command run: \`uv run pytest tests/integrations/test_deepseek_lane_routing.py -v\`"
            echo "- Pass/fail: **$result**"
            echo "- Local reproduction: \`uv run pytest tests/integrations/test_deepseek_lane_routing.py -v\`"
