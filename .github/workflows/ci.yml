name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CI_ARTIFACT_DIR: .build/github-actions

jobs:
  schema-validation:
    name: Schema validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install uv with caching
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run schema validation
        id: run_schema_validation
        run: uv run python scripts/rig_relay_validate_schemas.py

      - name: Write schema validation summary
        if: always()
        run: |
          mkdir -p "$CI_ARTIFACT_DIR"
          case "${{ steps.run_schema_validation.outcome }}" in
            success) result=pass ;;
            failure) result=fail ;;
            skipped) result=not-run ;;
            *) result="${{ steps.run_schema_validation.outcome }}" ;;
          esac

          cat > "$CI_ARTIFACT_DIR/schema-validation-summary.json" <<EOF
          {
            "job_id": "schema-validation",
            "job_name": "Schema validation",
            "result": "$result",
            "commands": [
              "uv run python scripts/rig_relay_validate_schemas.py"
            ],
            "local_reproduction": [
              "uv run python scripts/rig_relay_validate_schemas.py"
            ],
            "artifacts": [
              ".build/github-actions/schema-validation-summary.json"
            ]
          }
          EOF

          {
            echo "## Schema validation"
            echo
            echo "- Command run: \`uv run python scripts/rig_relay_validate_schemas.py\`"
            echo "- Pass/fail: **$result**"
            echo "- Local reproduction: \`uv run python scripts/rig_relay_validate_schemas.py\`"
            echo "- Artifact path: \`.build/github-actions/schema-validation-summary.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload schema validation summary
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: schema-validation-summary
          path: .build/github-actions/schema-validation-summary.json
          if-no-files-found: error
          retention-days: 7

  static-site-renderer:
    name: Static site renderer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install uv with caching
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run site renderer tests
        id: run_site_renderer_tests
        run: uv run pytest tests/site_renderer/ -v

      - name: Render static site
        id: run_static_site_render
        run: uv run python scripts/rig_site_render.py

      - name: Write static site renderer summary
        if: always()
        run: |
          mkdir -p "$CI_ARTIFACT_DIR"
          case "${{ steps.run_site_renderer_tests.outcome }}" in
            success) test_result=pass ;;
            failure) test_result=fail ;;
            skipped) test_result=not-run ;;
            *) test_result="${{ steps.run_site_renderer_tests.outcome }}" ;;
          esac
          case "${{ steps.run_static_site_render.outcome }}" in
            success) render_result=pass ;;
            failure) render_result=fail ;;
            skipped) render_result=not-run ;;
            *) render_result="${{ steps.run_static_site_render.outcome }}" ;;
          esac

          cat > "$CI_ARTIFACT_DIR/static-site-renderer-summary.json" <<EOF
          {
            "job_id": "static-site-renderer",
            "job_name": "Static site renderer",
            "result": {
              "tests": "$test_result",
              "render": "$render_result"
            },
            "commands": [
              "uv run pytest tests/site_renderer/ -v",
              "uv run python scripts/rig_site_render.py"
            ],
            "local_reproduction": [
              "uv run pytest tests/site_renderer/ -v",
              "uv run python scripts/rig_site_render.py"
            ],
            "artifacts": [
              ".build/github-actions/static-site-renderer-summary.json",
              ".build/rig-relay/site/site_render_report.v1.json"
            ]
          }
          EOF

          {
            echo "## Static site renderer"
            echo
            echo "- Command run: \`uv run pytest tests/site_renderer/ -v\`"
            echo "- Pass/fail: **$test_result**"
            echo "- Local reproduction: \`uv run pytest tests/site_renderer/ -v\`"
            echo "- Command run: \`uv run python scripts/rig_site_render.py\`"
            echo "- Pass/fail: **$render_result**"
            echo "- Local reproduction: \`uv run python scripts/rig_site_render.py\`"
            echo "- Artifact path: \`.build/github-actions/static-site-renderer-summary.json\`"
            echo "- Artifact path: \`.build/rig-relay/site/site_render_report.v1.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload static site renderer artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: static-site-renderer-artifacts
          path: |
            .build/github-actions/static-site-renderer-summary.json
            .build/rig-relay/site/site_render_report.v1.json
          if-no-files-found: error
          retention-days: 7

  deepseek-opencode-usage-report:
