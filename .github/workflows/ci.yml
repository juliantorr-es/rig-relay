          path: .build/github-actions/deepseek-lane-routing-summary.json
          if-no-files-found: error
          retention-days: 7

  github-live-auth:
    name: GitHub live auth (safe by default)
    runs-on: ubuntu-latest
    env:
      RIG_LIVE_AUTH_TESTS: ${{ vars.RIG_LIVE_AUTH_TESTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install uv with caching
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run safe GitHub live auth tests
        id: run_github_live_auth_safe
        run: uv run pytest tests/integrations/test_github_live_auth.py -v

      - name: Run opt-in GitHub live auth smoke
        id: run_github_live_auth_live
        if: ${{ env.RIG_LIVE_AUTH_TESTS == '1' }}
        run: uv run python scripts/rig_github_live_auth_check.py --live --output-json .build/github-actions/github-live-auth-live-result.json

      - name: Write GitHub live auth summary
        if: always()
        run: |
          mkdir -p "$CI_ARTIFACT_DIR"
          case "${{ steps.run_github_live_auth_safe.outcome }}" in
            success) safe_result=pass ;;
            failure) safe_result=fail ;;
            skipped) safe_result=not-run ;;
            *) safe_result="${{ steps.run_github_live_auth_safe.outcome }}" ;;
          esac
          case "${{ steps.run_github_live_auth_live.outcome }}" in
            success) live_result=pass ;;
            failure) live_result=fail ;;
            skipped) live_result=not-run ;;
            *) live_result="${{ steps.run_github_live_auth_live.outcome }}" ;;
          esac

          cat > "$CI_ARTIFACT_DIR/github-live-auth-summary.json" <<EOF
          {
            "job_id": "github-live-auth",
            "job_name": "GitHub live auth (safe by default)",
            "result": {
              "safe_tests": "$safe_result",
              "opt_in_live_smoke": "$live_result"
            },
            "commands": [
              "uv run pytest tests/integrations/test_github_live_auth.py -v",
              "RIG_LIVE_AUTH_TESTS=1 uv run python scripts/rig_github_live_auth_check.py --live --output-json .build/github-actions/github-live-auth-live-result.json"
            ],
            "local_reproduction": [
              "uv run pytest tests/integrations/test_github_live_auth.py -v",
              "RIG_LIVE_AUTH_TESTS=1 uv run python scripts/rig_github_live_auth_check.py --live --output-json .build/github-actions/github-live-auth-live-result.json"
            ],
            "artifacts": [
              ".build/github-actions/github-live-auth-summary.json",
              ".build/github-actions/github-live-auth-live-result.json"
            ],
            "notes": "Default CI leaves RIG_LIVE_AUTH_TESTS unset. Only protected environments should set it to 1."
          }
          EOF

          {
            echo "## GitHub live auth (safe by default)"
            echo
            echo "- Command run: \`uv run pytest tests/integrations/test_github_live_auth.py -v\`"
            echo "- Pass/fail: **$safe_result**"
            echo "- Local reproduction: \`uv run pytest tests/integrations/test_github_live_auth.py -v\`"
            echo "- Command run: \`RIG_LIVE_AUTH_TESTS=1 uv run python scripts/rig_github_live_auth_check.py --live --output-json .build/github-actions/github-live-auth-live-result.json\`"
            echo "- Pass/fail: **$live_result**"
            echo "- Local reproduction: \`RIG_LIVE_AUTH_TESTS=1 uv run python scripts/rig_github_live_auth_check.py --live --output-json .build/github-actions/github-live-auth-live-result.json\`"
            echo "- Artifact path: \`.build/github-actions/github-live-auth-summary.json\`"
            echo "- Artifact path: \`.build/github-actions/github-live-auth-live-result.json\`"
            echo "- Notes: default CI keeps \`RIG_LIVE_AUTH_TESTS\` unset; only a protected environment should set it to \`1\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub live auth artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: github-live-auth-artifacts
          path: |
            .build/github-actions/github-live-auth-summary.json
            .build/github-actions/github-live-auth-live-result.json
          if-no-files-found: warn
          retention-days: 7

  release-gate:
    name: Release Evidence Gate (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - schema-validation
      - static-site-renderer
      - deepseek-opencode-usage-report
      - deepseek-lane-routing
      - github-live-auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install uv with caching
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Produce CI evidence
        id: produce_ci_evidence
        run: |
          uv run python -c "
          from rig_relay.ci_evidence import produce_ci_evidence
          result = produce_ci_evidence()
          print(f'CI evidence verdict: {result.verdict}')
          print(f'Evidence paths: {result.evidence_paths}')
          "

      - name: Run release evidence gate
        id: run_release_gate
        run: uv run python -m rig_relay.release_gate --output .build/rig-relay/release-gate-ci.json

      - name: Write advisory release gate summary
        if: always()
        run: |
          mkdir -p "$CI_ARTIFACT_DIR"
          case "${{ steps.produce_ci_evidence.outcome }}" in
            success) evidence_result=pass ;;
            failure) evidence_result=fail ;;
            skipped) evidence_result=not-run ;;
            *) evidence_result="${{ steps.produce_ci_evidence.outcome }}" ;;
          esac
          case "${{ steps.run_release_gate.outcome }}" in
            success) gate_result=pass ;;
            failure) gate_result=fail ;;
            skipped) gate_result=not-run ;;
            *) gate_result="${{ steps.run_release_gate.outcome }}" ;;
          esac

          cat > "$CI_ARTIFACT_DIR/release-gate-advisory-summary.json" <<EOF
          {
            "job_id": "release-gate",
            "job_name": "Release Evidence Gate (advisory)",
            "result": {
              "produce_ci_evidence": "$evidence_result",
              "release_gate": "$gate_result"
            },
            "commands": [
              "uv run python -c \"from rig_relay.ci_evidence import produce_ci_evidence; result = produce_ci_evidence(); print(result.verdict); print(result.evidence_paths)\"",
              "uv run python -m rig_relay.release_gate --output .build/rig-relay/release-gate-ci.json"
            ],
            "local_reproduction": [
              "uv run python -c \"from rig_relay.ci_evidence import produce_ci_evidence; result = produce_ci_evidence(); print(result.verdict); print(result.evidence_paths)\"",
              "uv run python -m rig_relay.release_gate --output .build/rig-relay/release-gate-ci.json"
            ],
            "artifacts": [
              ".build/github-actions/release-gate-advisory-summary.json",
              ".build/rig-relay/evidence/ci_*_run.v1.json",
              ".build/rig-relay/evidence/ci_*_job.v1.json",
              ".build/rig-relay/evidence/ci_*_artifact_index.v1.json",
              ".build/rig-relay/evidence/ci_*_verdict.v1.json",
              ".build/rig-relay/release-gate-ci.json"
            ],
            "notes": "Advisory only: broader release-evidence diagnostics remain available, but the deterministic required gate is the targeted local validation suite."
          }
          EOF

          {
            echo "## Release Evidence Gate (advisory)"
            echo
            echo "- Command run: \`uv run python -c \"from rig_relay.ci_evidence import produce_ci_evidence; result = produce_ci_evidence(); print(result.verdict); print(result.evidence_paths)\"\`"
            echo "- Pass/fail: **$evidence_result**"
            echo "- Local reproduction: \`uv run python -c \"from rig_relay.ci_evidence import produce_ci_evidence; result = produce_ci_evidence(); print(result.verdict); print(result.evidence_paths)\"\`"
            echo "- Command run: \`uv run python -m rig_relay.release_gate --output .build/rig-relay/release-gate-ci.json\`"
            echo "- Pass/fail: **$gate_result**"
            echo "- Local reproduction: \`uv run python -m rig_relay.release_gate --output .build/rig-relay/release-gate-ci.json\`"
            echo "- Artifact path: \`.build/github-actions/release-gate-advisory-summary.json\`"
            echo "- Artifact path: \`.build/rig-relay/evidence/ci_*_run.v1.json\`"
            echo "- Artifact path: \`.build/rig-relay/evidence/ci_*_job.v1.json\`"
            echo "- Artifact path: \`.build/rig-relay/evidence/ci_*_artifact_index.v1.json\`"
            echo "- Artifact path: \`.build/rig-relay/evidence/ci_*_verdict.v1.json\`"
            echo "- Artifact path: \`.build/rig-relay/release-gate-ci.json\`"
            echo "- Notes: advisory only; required merge gates are the targeted, reproducible commands above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload advisory CI evidence artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-evidence
          path: |
            .build/rig-relay/evidence/ci_*_run.v1.json
            .build/rig-relay/evidence/ci_*_job.v1.json
            .build/rig-relay/evidence/ci_*_artifact_index.v1.json
            .build/rig-relay/evidence/ci_*_verdict.v1.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload advisory release gate result
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-gate-result
          path: |
            .build/github-actions/release-gate-advisory-summary.json
            .build/rig-relay/release-gate-ci.json
          if-no-files-found: warn
          retention-days: 7
