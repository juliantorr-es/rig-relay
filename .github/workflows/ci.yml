          name: deepseek-opencode-usage-report-summary
          path: .build/github-actions/deepseek-opencode-usage-report-summary.json
          if-no-files-found: error
          retention-days: 7

  deepseek-lane-routing:
    name: DeepSeek lane routing
    runs-on: ubuntu-latest

