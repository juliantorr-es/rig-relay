[project]
name = "rig-relay"
version = "0.1.0a1"
description = "Rig Relay coding-agent harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Julian Torres" }]
keywords = ["ai", "cli", "coding-assistant", "rig", "llm", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "agent-client-protocol==0.9.0",
  "anyio>=4.12.0",
  "cachetools>=5.5.0",
  "certifi>=2026.4.22",
  "charset-normalizer>=3.4.4",
  "cryptography>=44.0.0",
  "gitpython>=3.1.46",
  "giturlparse>=0.14.0",
  "google-api-python-client>=2.0.0",
  "google-auth>=2.0.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.0.0",
  "httpx>=0.28.1",
    "jinja2>=3.1.0",
    "jsonpatch>=1.33",
    "keyring>=25.6.0",
  "markdownify>=1.2.2",
  "mcp>=1.14.0",
  "mistralai==2.4.4",
  "opentelemetry-api>=1.39.1",
  "opentelemetry-exporter-otlp-proto-http>=1.39.1",
  "opentelemetry-sdk>=1.39.1",
  "opentelemetry-semantic-conventions>=0.60b1",
  "packaging>=24.1",
  "pexpect>=4.9.0",
  "pydantic>=2.12.4",
  "pydantic-settings>=2.12.0",
  "pyperclip>=1.11.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "requests>=2.20.0",
  "rich>=14.0.0",
  "sounddevice>=0.5.1",
  "textual==8.2.4",
  "textual-speedups>=0.2.1",
  "tiktoken>=0.9.0",
  "tomli-w>=1.2.0",
  "tree-sitter>=0.25.2",
  "tree-sitter-bash>=0.25.1",
  "watchfiles>=1.1.1",
  "websockets>=13.0",
  "duckdb>=1.5.0",
  "jsonschema>=4.23.0",
  "pywebview>=4.10",
  "zstandard>=0.25.0",
  "pyobjc-framework-LocalAuthentication; sys_platform == 'darwin'",
  "pyrefly>=0.64.0",
  "ast-grep-py>=0.42.1",
  "platformdirs>=4.9.6",
]

[project.optional-dependencies]
workbench = ["marimo>=0.10.0", "altair>=5.5.0", "pandas>=2.0.0"]

[project.urls]
Homepage = "https://github.com/juliantorr-es/rig-relay"
Repository = "https://github.com/juliantorr-es/rig-relay"
Issues = "https://github.com/juliantorr-es/rig-relay/issues"
Documentation = "https://github.com/juliantorr-es/rig-relay#readme"

[build-system]
requires = ["hatchling", "hatch-vcs", "editables"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = ["rig_relay/"]


[project.scripts]
rig-relay = "rig_relay.cli.entrypoint:main"
rig-relay-acp = "rig_relay.cli.acp_entrypoint:main"
rig-relay-cockpit = "rig_relay.cli.desktop_cockpit:main"
rig-relay-ide-sidecar = "rig_relay.cli.ide_sidecar:main"


[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { agent-client-protocol = false, mistralai = false }

package = true
required-version = ">=0.8.0"


[dependency-groups]
dev = [
  "debugpy>=1.8.19",
  "pre-commit>=4.2.0",
  "pyinstaller>=6.20.0",
  "pyinstrument>=5.1.2",
  "pyright>=1.1.403",
  "pytest>=8.3.5",
  "pytest-asyncio>=1.2.0",
  "pytest-playwright>=0.7.2",
  "pytest-textual-snapshot>=1.1.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "respx>=0.22.0",
  "ruff>=0.14.5",
  "twine>=5.0.0",
  "typos>=1.34.0",
  "vulture>=2.14",
]

build = ["pyinstaller>=6.17.0", "truststore>=0.10.4"]

[tool.pyright]
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportPrivateImportUsage = false

include = ["rig_relay/**/*.py", "tests/**/*.py"]
exclude = ["pyinstaller/", "docs/schemas/"]
venvPath = "."
venv = ".venv"

[tool.ruff]
include = ["rig_relay/**/*.py", "tests/**/*.py"]
exclude = ["pyinstaller/", "docs/schemas/"]
line-length = 88
target-version = "py312"
preview = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
  "F",
  "I",
  "D2",
  "UP",
  "TID",
  "ANN",
  "PLR",
  "B0",
  "B905",
  "DOC102",
  "RUF022",
  "RUF010",
  "RUF012",
  "RUF019",
  "RUF100",
]
ignore = ["D203", "D205", "D213", "ANN401", "PLR6301"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR"]
"notebooks/*" = ["ANN", "PLR", "I001", "RUF100"]
# Textual parent classes don't use ClassVar, so we can't either without breaking pyright
"vibe/cli/textual_ui/ansi_markdown.py" = ["RUF012"]
"vibe/core/telemetry/send.py" = ["PLR"]
"vibe/core/telemetry/duckdb_projection.py" = ["PLR"]
"vibe/core/context/assembler.py" = ["PLR"]
"rig_relay/runtime/tool_invocation_execution.py" = ["PLR"]
"rig_relay/desktop/websocket_server.py" = ["PLR"]
"rig_relay/release_gate/_runtime_readiness.py" = ["PLR"]
"rig_relay/analytics/bash_rows.py" = ["PLR"]
"rig_relay/ralph/scanner.py" = ["PLR"]
"rig_relay/desktop/intents.py" = ["PLR"]
"rig_relay/providers/model_capabilities.py" = ["PLR"]
"rig_relay/evidence/google_drive_upload.py" = ["PLR"]
"rig_relay/integrations/google_workspace/_live_adapter.py" = ["PLR"]
"rig_relay/sdk/__init__.py" = ["PLR"]
"rig_relay/core/tools/builtins/github_ci_cd.py" = ["PLR"]
"rig_relay/core/agent_loop.py" = ["PLR"]
"rig_relay/cli/desktop_cockpit.py" = ["PLR"]
"rig_relay/core/tool_runtime.py" = ["PLR"]
"rig_relay/core/tools/reroute.py" = ["PLR"]
"rig_relay/cli/ide_sidecar.py" = ["PLR"]
"rig_relay/core/tools/builtins/report.py" = ["PLR", "ANN"]
"scripts/rig_relay_generate_ide_capability_map.py" = ["PLR"]
"rig_relay/docs_renderer/cli.py" = ["PLR"]
"rig_relay/site_renderer/normalizers.py" = ["PLR"]
"scripts/package_release.py" = ["PLR"]
"scripts/rig_site_render.py" = ["PLR"]
"rig_relay/governance/findings_lifecycle.py" = ["PLR"]
"rig_relay/ci_evidence/_producer.py" = ["PLR"]
"rig_relay/compiler_experiments/experiment_0.py" = ["PLR"]
"rig_relay/integrations/github_provider/_capabilities.py" = ["PLR"]
"rig_relay/integrations/google_workspace/_capabilities.py" = ["PLR"]
"rig_relay/coordination/models.py" = ["PLR0913"]
"rig_relay/desktop/bridge_refusals.py" = ["PLR0913", "PLR0911"]
"rig_relay/protocols/mcp/server.py" = ["PLR"]
"rig_relay/integrations/provider_registry/_operating_picture_registry.py" = ["PLR0913", "PLR0914", "PLR0917"]
"rig_relay/protocols/a2a/server.py" = ["PLR"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["rig_relay"]
force-sort-within-sections = true
split-on-trailing-comma = false
combine-as-imports = true
force-wrap-aliases = false
order-by-type = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pylint]
max-public-methods = 26
max-positional-args = 10
max-statements = 50
max-branches = 15
max-locals = 15
max-args = 10
max-returns = 6
max-nested-blocks = 5

[tool.vulture]
ignore_decorators = ["@*"]

[tool.pytest.ini_options]
addopts = "-vvvv -q -n auto --durations=10 --import-mode=importlib --maxschedchunk=1"
timeout = 10
markers = [
  "smoke: fastest confidence checks; must pass before demo/share",
  "contract: domain contract/unit tests",
  "integration: crosses multiple components/processes/filesystems",
  "e2e: broad-stack or full flow",
  "adversarial: adversarial or injection-focused coverage",
  "packaging: packaged app / installer / bundle checks",
  "slow: intentionally slow",
  "legacy: retained but not part of default suite",
  "flaky: known nondeterministic, must not run in default suite",
  "network: requires external network",
  "provider: requires external model/provider/API",
  "destructive: mutates worktrees/branches/files beyond temp dirs",
  "migration: test being relocated during test layout canonicalization",
  "quarantine: quarantined test, runs only in dedicated quarantine job",
  "sabotage: corruption/sabotage injection tests for runtime hardening",
  "real_artifact: tests using real file artifacts (no mocking)",
  "substrate: storage, cache, or infrastructure substrate coverage",
]
filterwarnings = [
  # (e2e) streaming mock server is started in a thread; and the cli is spawn in a fork
  "ignore:This process \\(pid=.*\\) is multi-threaded, use of forkpty\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning",
]
