[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["rig_relay"]
force-sort-within-sections = true
split-on-trailing-comma = false
combine-as-imports = true
force-wrap-aliases = false
order-by-type = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pylint]
max-public-methods = 26
max-positional-args = 10
max-statements = 50
max-branches = 15
max-locals = 15
max-args = 10
max-returns = 6
max-nested-blocks = 5

[tool.vulture]
ignore_decorators = ["@*"]

[tool.pytest.ini_options]
addopts = "-vvvv -q -n auto --durations=10 --import-mode=importlib --maxschedchunk=1"
timeout = 10
markers = [
  "smoke: fastest confidence checks; must pass before demo/share",
  "contract: domain contract/unit tests",
  "integration: crosses multiple components/processes/filesystems",
  "e2e: broad-stack or full flow",
  "adversarial: adversarial or injection-focused coverage",
  "packaging: packaged app / installer / bundle checks",
  "slow: intentionally slow",
  "legacy: retained but not part of default suite",
  "flaky: known nondeterministic, must not run in default suite",
  "network: requires external network",
  "provider: requires external model/provider/API",
  "destructive: mutates worktrees/branches/files beyond temp dirs",
  "migration: test being relocated during test layout canonicalization",
  "quarantine: quarantined test, runs only in dedicated quarantine job",
  "sabotage: corruption/sabotage injection tests for runtime hardening",
  "concurrency: tests covering contention, lock ordering, or multi-session progress",
  "real_artifact: tests using real file artifacts (no mocking)",
  "substrate: storage, cache, or infrastructure substrate coverage",
]
filterwarnings = [
  # (e2e) streaming mock server is started in a thread; and the cli is spawn in a fork
  "ignore:This process \\(pid=.*\\) is multi-threaded, use of forkpty\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning",
]
