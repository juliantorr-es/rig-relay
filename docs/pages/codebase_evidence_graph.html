<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codebase Evidence Graph — Rig Relay</title>
<style>
:root{--bg:#0d1117;--bg-alt:#161b22;--border:#30363d;--text:#c9d1d9;--dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--yellow:#e3b341;--red:#f85149}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:20px}
h1{color:var(--accent);margin-bottom:8px}
p.sub{color:var(--dim);font-size:.9em;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.stat .num{font-size:2em;font-weight:700;color:var(--accent)}
.stat .lbl{font-size:.8em;color:var(--dim);margin-top:4px}
input[type=search]{width:100%;padding:10px 16px;background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1em;margin-bottom:16px}
input:focus{outline:none;border-color:var(--accent)}
select{padding:8px 12px;background:var(--bg-alt);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85em;margin-right:8px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.85em}
th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--dim);position:sticky;top:0;background:var(--bg)}
td{padding:8px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--bg-alt)}
.type-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75em}
.type-file{background:rgba(88,166,255,.15);color:var(--accent)}
.type-function{background:rgba(63,185,80,.15);color:var(--green)}
.type-module{background:rgba(210,153,34,.15);color:var(--yellow)}
.type-schema{background:rgba(139,148,158,.15);color:var(--dim)}
.type-artifact{background:rgba(248,81,73,.15);color:var(--red)}
.tabs{display:flex;gap:2px;margin-bottom:20px}
.tab{padding:8px 16px;background:var(--bg-alt);border:1px solid var(--border);border-radius:6px 6px 0 0;color:var(--dim);cursor:pointer;font-size:.85em}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<h1>Codebase Evidence Graph</h1>
<p class="sub">Generated by Rig Relay — deterministic, content-light. Nodes: 14,004 | Edges: 3,026 | 9 node types | 2 edge types.</p>

<div class="stats">
  <div class="stat"><div class="num" id="stat-nodes">—</div><div class="lbl">Nodes</div></div>
  <div class="stat"><div class="num" id="stat-edges">—</div><div class="lbl">Edges</div></div>
  <div class="stat"><div class="num" id="stat-schemas">—</div><div class="lbl">Schemas</div></div>
  <div class="stat"><div class="num" id="stat-artifacts">—</div><div class="lbl">Artifacts</div></div>
  <div class="stat"><div class="num" id="stat-functions">—</div><div class="lbl">Functions</div></div>
  <div class="stat"><div class="num" id="stat-imports">—</div><div class="lbl">Import Edges</div></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="filterNodes('all')">All</div>
  <div class="tab" onclick="filterNodes('function')">Functions</div>
  <div class="tab" onclick="filterNodes('file')">Files</div>
  <div class="tab" onclick="filterNodes('class')">Classes</div>
  <div class="tab" onclick="filterNodes('schema')">Schemas</div>
  <div class="tab" onclick="filterNodes('artifact')">Artifacts</div>
  <div class="tab" onclick="filterNodes('module')" style="display:none">Modules</div>
</div>

<input type="search" id="search" placeholder="Search 14,004 nodes — type a name, path, or SHA prefix" oninput="renderTable()">

<select id="typeFilter" onchange="renderTable()">
  <option value="">All types</option>
</select>

<table><thead><tr><th>Type</th><th>Label</th><th>Path / Details</th></tr></thead>
<tbody id="tbody"></tbody></table>

<script>
let graph = null;
let currentFilter = 'all';

async function init() {
  const resp = await fetch('../json/governance/codebase_evidence_graph_v1.v1.json');
  graph = await resp.json();
  const summary = graph.summary;
  document.getElementById('stat-nodes').textContent = summary.total_nodes.toLocaleString();
  document.getElementById('stat-edges').textContent = summary.total_edges.toLocaleString();
  document.getElementById('stat-schemas').textContent = (summary.node_type_counts.schema || 0).toLocaleString();
  document.getElementById('stat-artifacts').textContent = (summary.node_type_counts.artifact || 0).toLocaleString();
  document.getElementById('stat-functions').textContent = (summary.node_type_counts.function || 0).toLocaleString();
  document.getElementById('stat-imports').textContent = (summary.edge_type_counts.depends_on || 0).toLocaleString();
  
  const types = Object.keys(summary.node_type_counts).sort();
  const sel = document.getElementById('typeFilter');
  types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = `${t} (${summary.node_type_counts[t]})`; sel.appendChild(o); });
  
  renderTable();
}

function filterNodes(type) {
  currentFilter = type;
  document.getElementById('typeFilter').value = type;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => { if (t.textContent.toLowerCase().includes(type) || (type==='all' && t.textContent==='All')) t.classList.add('active'); });
  if (type==='all') document.querySelector('.tab').classList.add('active');
  renderTable();
}

function renderTable() {
  if (!graph) return;
  const q = (document.getElementById('search').value || '').toLowerCase();
  const tf = document.getElementById('typeFilter').value || currentFilter;
  let nodes = graph.nodes;
  if (tf && tf !== 'all') nodes = nodes.filter(n => n.node_type === tf);
  if (q) nodes = nodes.filter(n => (n.label||'').toLowerCase().includes(q) || (n.relative_path||'').toLowerCase().includes(q) || (n.node_id||'').toLowerCase().includes(q));
  
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const slice = nodes.slice(0, 200);
  slice.forEach(n => {
    const tr = document.createElement('tr');
    const cls = 'type-' + (n.node_type === 'function' ? 'function' : n.node_type === 'class' ? 'module' : n.node_type === 'file' ? 'file' : n.node_type === 'schema' ? 'schema' : n.node_type === 'artifact' ? 'artifact' : 'module');
    tr.innerHTML = `<td><span class="type-badge ${cls}">${n.node_type}</span></td><td>${n.label || ''}</td><td style="font-size:.8em;color:var(--dim)">${n.relative_path || n.schema_id || n.node_id?.substring(0,16) || ''}</td>`;
    tbody.appendChild(tr);
  });
  if (nodes.length > 200) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="3" style="text-align:center;color:var(--dim);padding:16px">Showing 200 of ${nodes.length.toLocaleString()} nodes. Narrow your search.</td>`;
    tbody.appendChild(tr);
  }
}

init();
</script>
</body>
</html>
